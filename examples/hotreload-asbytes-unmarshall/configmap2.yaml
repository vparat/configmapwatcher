apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: default
data:
  config.yaml: |
    items:
      - name: item1
        disabled: false
        items-in:
          name: items1-in
          namespace: "default"
          cpu: 100m
          memory: 128Mi
      - name: item2
        disabled: true
        items-in:
          name: items2-in
          namespace: "default"
          cpu: 150m
          memory: 512Mi
